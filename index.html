<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>METZ FIGHTER</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    /* ─── Netplay lobby / overlays ─── */
    #netplay-lobby, #netplay-drop {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.82); padding: 16px;
    }
    #netplay-card {
      background: #14141c; border: 2px solid #f5c51866; border-radius: 8px;
      padding: 28px 30px; text-align: center; max-width: 420px; width: 100%;
      box-shadow: 0 0 30px #f5c51833;
    }
    #netplay-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 4px;
      color: #f5c518; text-shadow: 0 0 16px #f5c518;
    }
    #netplay-sub { font-size: 7px; color: #888; letter-spacing: 3px; margin: 8px 0 20px; }
    #netplay-div { font-size: 7px; color: #555; margin: 14px 0; letter-spacing: 2px; }
    #netplay-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    #netplay-row .ko-btn { pointer-events: all; }
    #net-peer-id {
      flex: 1; min-width: 140px; background: #000; border: 1px solid #ffffff22;
      color: #fff; font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 12px; border-radius: 2px;
    }
    #netplay-myid { font-size: 7px; color: #00ff88; margin-top: 12px; line-height: 2; word-break: break-all; }
    #netplay-status { font-size: 7px; color: #aaa; margin-top: 10px; line-height: 2; min-height: 28px; }
    #netplay-wait {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 950;
      background: rgba(0,0,0,0.72); border: 1.5px solid #f5c518; color: #f5c518;
      font-size: 8px; padding: 10px 18px; letter-spacing: 2px; border-radius: 2px;
      box-shadow: 0 0 12px #f5c518; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div id="hud-top">
      <div id="player-hud">
        <span class="hud-name">P1</span>
        <div class="health-bar-wrap">
          <div class="health-bar" id="player-health-bar"></div>
        </div>
        </div>
      <div id="round-info">
        <div id="round-label">RND 1</div>
        <div id="timer">99</div>
      </div>
      <div id="cpu-hud">
        <div class="health-bar-wrap cpu">
          <div class="health-bar cpu" id="cpu-health-bar"></div>
        </div>
        <span class="hud-name">CPU</span>
      </div>
    </div>

    <div id="state-badge" class="hidden"></div>

    <!-- Desktop controls hint -->
    <div id="controls-bar">
      <span><kbd>J</kbd> Light</span>
      <span><kbd>K</kbd> Heavy/Sig</span>
      <span><kbd>L</kbd> Dodge</span>
      <span><kbd>SPACE</kbd> Pular (x3 no ar)</span>
      <span><kbd>↓</kbd> Fast Fall</span>
      <span><kbd>→→</kbd> Dash</span>
      <span><kbd>Spot Dodge + J/K</kbd> Gravity Cancel</span>
    </div>

    <!-- Mobile controls -->
    <div id="mobile-controls">
      <!-- D-pad esquerdo: 4 direções -->
      <div id="dpad">
        <div id="dpad-row-top">
          <button class="dpad-btn" id="btn-up"   data-key="arrowup">▲</button>
        </div>
        <div id="dpad-row-mid">
          <button class="dpad-btn" id="btn-left"  data-key="arrowleft">◀</button>
          <div class="dpad-center"></div>
          <button class="dpad-btn" id="btn-right" data-key="arrowright">▶</button>
        </div>
        <div id="dpad-row-bot">
          <button class="dpad-btn" id="btn-down"  data-key="arrowdown">▼</button>
        </div>
      </div>

      <!-- Botões de ação direita -->
      <div id="action-btns">
        <div class="action-row">
          <button class="action-btn btn-punch" data-key="j">LEVE</button>
          <button class="action-btn btn-kick"  data-key="k">FORTE</button>
          <button class="action-btn btn-dodge" data-key="l">DODGE</button>
        </div>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="intro.js"></script>
  <script src="hitboxes.js"></script>
  <script src="charselect.js"></script>
  <script src="input.js"></script>
  <script src="player.js"></script>
  <script src="netplay.js"></script>
  <script src="game.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
